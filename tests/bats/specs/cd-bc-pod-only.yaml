apiVersion: v1
kind: Pod
metadata:
  name: cd-bindingconditions-pod
  labels:
    e2e.nvidia.com/suite: cd-bindingconditions-pod
spec:
  containers:
  - name: ctr
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["ls -la /dev/nvidia-caps-imex-channels; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: cd-channel-0
  resourceClaims:
  - name: cd-channel-0
    resourceClaimTemplateName: cd-channel-0